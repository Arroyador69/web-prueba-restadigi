# CI para este repo: sistema de reservas (Express). Solo corre en carpeta "webs de reservas".
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'webs de reservas/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'webs de reservas/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webs de reservas
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'webs de reservas/package-lock.json'
        
    - name: Instalar dependencias
      run: npm ci
      
    - name: Verificar sintaxis
      run: |
        node -c server.js
        node -c database/init.js
        node -c utils/db.js
        node -c utils/email.js
        node -c utils/helpers.js
        node -c routes/public.js
        node -c routes/auth.js
        node -c routes/dashboard.js
    
    - name: Inicializar BD (test)
      run: node database/init.js
      
    - name: Resumen
      run: |
        echo "## CI - Sistema de reservas" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build OK" >> $GITHUB_STEP_SUMMARY
        echo "**Node:** ${{ matrix.node-version }} | **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webs de reservas
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    - name: Audit de seguridad
      run: npm audit --audit-level=high || true
