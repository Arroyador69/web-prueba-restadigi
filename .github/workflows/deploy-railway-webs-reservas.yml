name: Deploy Status - Webs de Reservas

on:
  push:
    branches: [ main, master ]
    paths:
      - 'webs de reservas/**'
      - '.github/workflows/deploy-railway-webs-reservas.yml'
  workflow_dispatch:

jobs:
  deploy-status:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deployment summary
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
        run: |
          {
            echo "## Deploy status - Webs de Reservas"
            echo ""
            echo "**Proyecto:** Webs de Reservas"
            echo "**Branch:** ${BRANCH}"
            echo "**Commit:** ${SHA}"
            echo "**Autor:** ${ACTOR}"
            echo "**Mensaje:**"
            printf '%s\n' "${COMMIT_MSG}"
            echo ""
            echo "Codigo pusheado correctamente (Vercel desplegara si el repo esta conectado)."
            echo ""
            echo "## Archivos modificados (Webs de Reservas)"
            echo ""
            if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "${BEFORE}" "${SHA}" | grep "webs de reservas" | head -20 | while IFS= read -r file; do
                echo "- \`${file}\`"
              done
            else
              echo "_Sin diff disponible (primer push o before vacio)._"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
