# Deploy: Railway se encarga del deploy al hacer push (conexión repo en Railway).
# No hace falta acción "railway/deploy" (no existe como acción pública).
name: CI - Push a main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Resumen
      run: |
        echo "## Push a main" >> $GITHUB_STEP_SUMMARY
        echo "Railway desplegará automáticamente si tienes el repo conectado." >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
