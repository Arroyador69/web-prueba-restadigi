[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = [
  "echo '🔧 Eliminando package-lock.json de la raíz...'",
  "rm -f ../package-lock.json ../../package-lock.json || true",
  "echo '✅ Instalando dependencias del proyecto...'",
  "npm ci --ignore-scripts"
]

[phases.build]
cmds = ["npm run build || true"]

[start]
cmd = "npm start"
