<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/brand-theme.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: rgba(37, 99, 235, 0.12);
            --secondary-color: #0f172a;
            --card-radius: 14px;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
            --shadow-card-hover: 0 4px 12px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.25s ease;
        }
        body { font-family: 'Inter', system-ui, sans-serif; }
        [x-cloak] { display: none !important; }

        /* Cards */
        .card { border-radius: var(--card-radius); box-shadow: var(--shadow-card); transition: box-shadow var(--transition-smooth), transform var(--transition-fast); }
        .card:hover { box-shadow: var(--shadow-card-hover); }
        .card-body { padding: 1.35rem 1.5rem; }

        /* Botones */
        .btn-primary { background: var(--primary-color); color: #fff; border-radius: 10px; padding: 0.5rem 1rem; min-height: 44px; font-weight: 500; transition: background var(--transition-fast), transform 0.15s ease; border: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-primary:active:not(:disabled) { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #f1f5f9; color: #334155; border-radius: 10px; padding: 0.5rem 1rem; min-height: 44px; font-weight: 500; transition: background var(--transition-fast), color var(--transition-fast); border: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .btn-secondary:hover { background: #e2e8f0; color: #1e293b; }
        .btn-ghost { color: var(--primary-color); background: transparent; border: none; padding: 0.5rem 0.75rem; font-weight: 500; border-radius: 8px; transition: background var(--transition-fast); }
        .btn-ghost:hover { background: var(--primary-light); }
        .btn-link { background: none; border: none; cursor: pointer; padding: 0; font-size: inherit; color: var(--primary-color); font-weight: 500; transition: opacity var(--transition-fast); }
        .btn-link:hover { opacity: 0.85; text-decoration: underline; }

        /* Inputs */
        .input-modern { width: 100%; padding: 0.5rem 1rem; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.9375rem; transition: border-color var(--transition-fast), box-shadow var(--transition-fast); }
        .input-modern:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); }
        .input-modern::placeholder { color: #94a3b8; }
        select.input-modern { cursor: pointer; appearance: auto; }
        textarea.input-modern { min-height: 2.5rem; resize: vertical; }

        /* Navegación */
        .nav-tab { padding: 0.875rem 1rem; font-weight: 500; border-radius: 10px; margin: 0 2px; color: #64748b; transition: background var(--transition-fast), color var(--transition-fast); border: none; background: transparent; cursor: pointer; }
        .nav-tab:hover { color: #1e293b; background: #f1f5f9; }
        .nav-tab-active { color: var(--primary-color); background: var(--primary-light); }
        .nav-tab-active:hover { color: var(--primary-hover); background: var(--primary-light); }

        /* Badges estado */
        .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 8px; font-size: 0.75rem; font-weight: 500; }
        .badge-confirmada { background: #dcfce7; color: #166534; }
        .badge-cancelada { background: #fee2e2; color: #991b1b; }
        .badge-pendiente { background: #fef9c3; color: #854d0e; }
        .badge-pasada { background: #f1f5f9; color: #475569; }
        .badge-no-asistio { background: #ffedd5; color: #9a3412; }
        .badge-completada { background: #ccfbf1; color: #0f766e; }

        /* Tablas */
        .table-modern { border-collapse: separate; border-spacing: 0; }
        .table-modern thead th { background: #f8fafc; font-weight: 600; color: #475569; font-size: 0.8125rem; padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .table-modern tbody tr { transition: background var(--transition-fast); }
        .table-modern tbody tr:hover { background: #f8fafc; }
        .table-modern tbody td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        .table-modern tbody td a, .table-modern tbody td .btn-link { color: var(--primary-color); font-weight: 500; }
        .table-modern tbody td a:hover, .table-modern tbody td .btn-link:hover { text-decoration: underline; }

        /* Animación entrada */
        .fade-in { animation: fadeIn 0.35s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-delay-1 { animation-delay: 0.05s; opacity: 0; }
        .fade-in-delay-2 { animation-delay: 0.1s; opacity: 0; }
        .fade-in-delay-3 { animation-delay: 0.15s; opacity: 0; }
        .fade-in-delay-4 { animation-delay: 0.2s; opacity: 0; }

        /* Header */
        .header-brand-initial { width: 42px; height: 42px; border-radius: 12px; background: var(--primary-color); color: #fff; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .header-brand-name { color: var(--secondary-color); }
        .color-swatch {
            width: 48px; height: 48px; border-radius: 12px; border: 2px solid #e2e8f0;
            -webkit-appearance: none; appearance: none; padding: 0; cursor: pointer;
            background: transparent; min-width: 48px; min-height: 48px;
        }
        .color-swatch::-webkit-color-swatch-wrapper { padding: 0; }
        .color-swatch::-webkit-color-swatch { border: none; border-radius: 10px; }
        .color-swatch::-moz-color-swatch { border: none; border-radius: 10px; }
        .preset-dot {
            width: 44px; height: 44px; border-radius: 9999px; border: 2px solid #fff;
            box-shadow: 0 0 0 1px #e2e8f0; cursor: pointer; -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .preset-dot.is-active { box-shadow: 0 0 0 2px var(--primary-color); }
        @media (max-width: 640px) { .header-brand-initial { width: 36px; height: 36px; font-size: 1rem; } }
        .safe-area-padding { padding-left: env(safe-area-inset-left, 0); padding-right: env(safe-area-inset-right, 0); }
        /* Móvil: navegación con scroll horizontal */
        .nav-tabs-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .nav-tabs-wrap::-webkit-scrollbar { display: none; }
        .nav-tab { white-space: nowrap; min-height: 44px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        @media (max-width: 640px) {
            .table-modern thead th, .table-modern tbody td { padding: 0.5rem 0.75rem; font-size: 0.8125rem; }
            .card-body { padding: 1rem 1.25rem; }
        }
        .modal-mobile { max-height: 90vh; overflow-y: auto; }
        @media (max-width: 640px) {
            .modal-mobile { border-radius: 1rem 1rem 0 0; margin: 0; max-height: 92vh; }
        }
        body { padding-bottom: env(safe-area-inset-bottom, 0); -webkit-text-size-adjust: 100%; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen">
    <div x-data="dashboard()" x-cloak x-init="init()" @app-lang-changed.window="onLangChanged($event)">
        <!-- Header profesional -->
        <header class="bg-white shadow-[0_1px_3px_rgba(0,0,0,0.06)] sticky top-0 z-40 safe-area-padding">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-4">
                <div class="flex justify-between items-center gap-3">
                    <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                        <template x-if="negocio.logo_url">
                            <img :src="negocio.logo_url" alt="Logo" class="h-9 w-9 sm:h-10 sm:w-10 object-contain rounded-xl flex-shrink-0">
                        </template>
                        <template x-if="!negocio.logo_url">
                            <div class="header-brand-initial" x-text="(config.businessName || negocio.nombre || 'M').charAt(0).toUpperCase()"></div>
                        </template>
                        <div class="min-w-0">
                            <h1 class="text-base sm:text-xl font-bold header-brand-name truncate" x-text="config.businessName || negocio.nombre || t('dash_panel')"></h1>
                            <p class="text-xs sm:text-sm text-gray-500 hidden sm:block" x-text="t('dash_panel')"></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <div x-html="langHtml"></div>
                        <button @click="logout()" class="btn-ghost text-gray-600 hover:text-gray-900 min-h-[44px] py-2 px-3 text-sm sm:text-base" x-text="t('dash_logout')"></button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navegación -->
        <div class="bg-white border-b border-gray-100 safe-area-padding">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
                <nav class="nav-tabs-wrap flex gap-1 py-2">
                    <button @click="activeTab = 'inicio'; loadStats()" class="nav-tab" :class="activeTab === 'inicio' && 'nav-tab-active'" x-text="t('tab_home')"></button>
                    <button @click="activeTab = 'appointments'" class="nav-tab" :class="activeTab === 'appointments' && 'nav-tab-active'" x-text="t('tab_appointments')"></button>
                    <button @click="activeTab = 'pacientes'; loadPacientes()" class="nav-tab" :class="activeTab === 'pacientes' && 'nav-tab-active'" x-text="t('tab_patients')"></button>
                    <button @click="activeTab = 'landing'; loadLanding()" class="nav-tab" :class="activeTab === 'landing' && 'nav-tab-active'" x-text="t('tab_landing')"></button>
                    <button @click="activeTab = 'lp_stats'; loadLandingStats()" class="nav-tab" :class="activeTab === 'lp_stats' && 'nav-tab-active'" x-text="t('tab_lp_stats')"></button>
                    <button @click="activeTab = 'facturas'; loadFacturas()" class="nav-tab" :class="activeTab === 'facturas' && 'nav-tab-active'" x-text="t('tab_invoices')"></button>
                    <button @click="activeTab = 'reputacion'; loadReputacion()" class="nav-tab" :class="activeTab === 'reputacion' && 'nav-tab-active'" x-text="t('tab_reputation')"></button>
                    <button @click="activeTab = 'config'" class="nav-tab" :class="activeTab === 'config' && 'nav-tab-active'" x-text="t('tab_config')"></button>
                    <button @click="activeTab = 'hours'" class="nav-tab" :class="activeTab === 'hours' && 'nav-tab-active'" x-text="t('tab_hours')"></button>
                    <button @click="activeTab = 'blocked'" class="nav-tab" :class="activeTab === 'blocked' && 'nav-tab-active'" x-text="t('tab_blocked')"></button>
                    <button @click="activeTab = 'users'" class="nav-tab" :class="activeTab === 'users' && 'nav-tab-active'" x-text="t('tab_users')"></button>
                </nav>
            </div>
        </div>

        <!-- Aviso demo: no es el producto final -->
        <div class="safe-area-padding border-b border-amber-200/80 bg-amber-50">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-3.5">
                <p class="text-sm sm:text-base font-semibold text-amber-950" x-text="t('demo_banner_title')"></p>
                <p class="text-xs sm:text-sm text-amber-900/90 mt-1 leading-relaxed" x-text="t('demo_banner_body')"></p>
            </div>
        </div>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-8">
            <!-- Tab: Inicio (estadísticas) -->
            <div x-show="activeTab === 'inicio'" class="fade-in">
                <p class="text-lg text-gray-700 mb-6" x-show="config.businessName || negocio.nombre"><span x-text="t('welcome')"></span><span class="font-semibold text-gray-900" x-text="config.businessName || negocio.nombre || ''"></span></p>
                <p class="text-lg text-gray-700 mb-6" x-show="!config.businessName && !negocio.nombre" x-text="t('summary_month')"></p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-6">
                    <div class="card bg-white fade-in fade-in-delay-1">
                        <div class="card-body flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 text-[var(--primary-color)] bg-[var(--primary-light)]" aria-hidden="true">📅</div>
                            <div class="min-w-0">
                                <h3 class="text-sm font-medium text-gray-500" x-text="t('dash_sessions_month')"></h3>
                                <p class="text-2xl font-bold text-gray-900 mt-0.5" x-text="stats.sesionesRealizadas ?? '—'"></p>
                            </div>
                        </div>
                    </div>
                    <div class="card bg-white fade-in fade-in-delay-2">
                        <div class="card-body flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 text-[var(--primary-color)] bg-[var(--primary-light)]" aria-hidden="true">€</div>
                            <div class="min-w-0">
                                <h3 class="text-sm font-medium text-gray-500" x-text="t('dash_billing')"></h3>
                                <p class="text-2xl font-bold text-gray-900 mt-0.5" x-text="stats.facturacionEstimada ?? '—'"></p>
                            </div>
                        </div>
                    </div>
                    <div class="card bg-white fade-in fade-in-delay-3">
                        <div class="card-body flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 text-red-600 bg-red-50" aria-hidden="true">✕</div>
                            <div class="min-w-0">
                                <h3 class="text-sm font-medium text-gray-500" x-text="t('dash_cancellations')"></h3>
                                <p class="text-2xl font-bold text-gray-900 mt-0.5" x-text="stats.cancelaciones ?? '—'"></p>
                            </div>
                        </div>
                    </div>
                    <div class="card bg-white fade-in fade-in-delay-4">
                        <div class="card-body flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 text-emerald-600 bg-emerald-50" aria-hidden="true">👥</div>
                            <div class="min-w-0">
                                <h3 class="text-sm font-medium text-gray-500" x-text="t('dash_active_patients')"></h3>
                                <p class="text-2xl font-bold text-gray-900 mt-0.5" x-text="stats.pacientesActivos ?? '—'"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="text-sm text-gray-500" x-show="stats.periodo"><span x-text="t('period')"></span> <span x-text="stats.periodo ? (stats.periodo.inicio + t('period_to') + stats.periodo.fin) : ''"></span></p>
            </div>

            <!-- Tab: Appointments -->
            <div x-show="activeTab === 'appointments'">
                <div class="card bg-white p-4 sm:p-6">
                    <div class="flex flex-col sm:flex-row sm:flex-wrap sm:justify-between sm:items-center gap-3 mb-5 sm:mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-900" x-text="t('dash_appointments')"></h2>
                        <div class="flex flex-wrap items-center gap-2">
                            <button @click="openModalCita()" class="btn-primary text-sm sm:text-base" x-text="t('dash_new_appointment')"></button>
                            <button @click="appointmentViewMode = appointmentViewMode === 'calendar' ? 'list' : 'calendar'" class="btn-secondary text-sm" x-text="appointmentViewMode === 'calendar' ? t('view_list') : t('view_calendar')"></button>
                            <button @click="loadCitas()" class="btn-ghost min-h-[44px] text-sm" x-text="t('dash_refresh')"></button>
                        </div>
                    </div>

                    <!-- Vista calendario semanal -->
                    <div x-show="appointmentViewMode === 'calendar'" class="overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0">
                        <div class="flex flex-wrap gap-2 items-center mb-3 sm:mb-4">
                            <div class="flex gap-2 flex-wrap">
                                <button @click="prevWeek()" class="btn-secondary text-xs sm:text-sm py-2" x-text="t('dash_prev')"></button>
                                <button @click="goToToday()" class="btn-secondary text-xs sm:text-sm py-2" x-text="t('dash_today')"></button>
                                <button @click="nextWeek()" class="btn-secondary text-xs sm:text-sm py-2" x-text="t('dash_next')"></button>
                            </div>
                            <h3 class="font-semibold text-gray-800 text-sm sm:text-base" x-text="getCalendarWeekLabel()"></h3>
                        </div>
                        <p class="text-xs text-gray-500 mb-2"><span x-text="t('dash_legend')"></span>: <span class="badge badge-confirmada" x-text="t('st_confirmed')"></span> <span class="badge badge-completada" x-text="t('st_completed')"></span> <span class="badge badge-pasada" x-text="t('st_past')"></span> <span class="badge badge-cancelada" x-text="t('st_cancelled')"></span> <span class="badge badge-pendiente" x-text="t('st_pending')"></span> <span class="badge badge-no-asistio" x-text="t('st_no_show')"></span></p>
                        <table class="w-full border border-gray-200 text-sm" style="min-width: 800px;">
                            <thead>
                                <tr class="bg-gray-100">
                                    <th class="border border-gray-200 p-2 w-14" x-text="t('time')"></th>
                                    <template x-for="(day, i) in getCalendarWeekDays()" :key="i">
                                        <th class="border border-gray-200 p-2" x-text="day.label"></th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="hour in getCalendarHours()" :key="hour">
                                    <tr>
                                        <td class="border border-gray-200 p-1 text-gray-600 align-top" x-text="String(hour).padStart(2,'0') + ':00'"></td>
                                        <template x-for="(day, di) in getCalendarWeekDays()" :key="di">
                                            <td class="border border-gray-200 p-1 align-top min-w-[120px]">
                                                <template x-for="c in getCitasInCell(day.date, hour)" :key="c.id">
                                                    <div class="text-xs rounded p-2 mb-1 border cursor-pointer"
                                                         :class="c.estado === 'confirmada' ? 'bg-emerald-50 border-emerald-200' : c.estado === 'completada' ? 'bg-teal-50 border-teal-200' : c.estado === 'pasada' ? 'bg-slate-100 border-slate-200' : c.estado === 'cancelada' ? 'bg-red-50 border-red-200' : c.estado === 'pendiente' ? 'bg-amber-50 border-amber-200' : 'bg-orange-50 border-orange-200'"
                                                         :title="(c.paciente_nombre || '') + (c.paciente_telefono ? ' · ' + t('tel_prefix') + c.paciente_telefono : '') + (c.tipo_sesion ? ' · ' + labelTipoSesion(c.tipo_sesion) : '')"
                                                         @click="openModalCita(c)">
                                                        <div class="font-medium text-gray-900" x-text="c.paciente_nombre"></div>
                                                        <div class="text-gray-600" x-text="c.hora_inicio"></div>
                                                        <div x-show="c.paciente_telefono" class="text-gray-500 truncate" x-text="c.paciente_telefono"></div>
                                                        <div x-show="c.tipo_sesion" class="text-gray-500" x-text="labelTipoSesion(c.tipo_sesion)"></div>
                                                        <button @click.stop="openDeleteModal(c)" class="mt-1 text-red-600 hover:underline" x-text="t('delete')"></button>
                                                    </div>
                                                </template>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Vista lista (filtros solo en lista) -->
                    <div x-show="appointmentViewMode === 'list'">
                        <div class="mb-4 flex gap-4">
                            <input type="date" x-model="filters.startDate" @change="loadCitas()" class="input-modern" :placeholder=\"t('date_start_ph')\">
                            <input type="date" x-model="filters.endDate" @change="loadCitas()" class="input-modern" :placeholder=\"t('date_end_ph')\">
                        </div>
                        <div class="space-y-4">
                            <template x-for="c in citas" :key="c.id">
                                <div class="card bg-white p-4 hover:bg-gray-50/80">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <h3 class="font-semibold text-gray-900" x-text="c.paciente_nombre"></h3>
                                            <p class="text-sm text-gray-600" x-text="c.paciente_email"></p>
                                            <p x-show="c.paciente_telefono" class="text-sm text-gray-600" x-text="t('tel_prefix') + c.paciente_telefono"></p>
                                            <p class="text-sm text-gray-600 mt-1"><span x-text="formatCitaFecha(c.fecha)"></span> <span x-text="c.hora_inicio"></span> - <span x-text="c.hora_fin"></span></p>
                                            <p class="text-xs mt-1"><span class="badge" :class="c.estado === 'confirmada' ? 'badge-confirmada' : c.estado === 'completada' ? 'badge-completada' : c.estado === 'pasada' ? 'badge-pasada' : c.estado === 'cancelada' ? 'badge-cancelada' : c.estado === 'pendiente' ? 'badge-pendiente' : 'badge-no-asistio'" x-text="labelEstado(c.estado)"></span> <span x-show="c.tipo_sesion" x-text="' · ' + labelTipoSesion(c.tipo_sesion)"></span></p>
                                        </div>
                                        <div>
                                            <button @click="openModalCita(c)" class="text-blue-600 hover:underline mr-2" x-text="t('edit')"></button>
                                            <button @click="openDeleteModal(c)" class="text-red-600 hover:text-red-700 text-sm font-medium" x-text="t('delete')"></button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <p x-show="citas.length === 0" class="text-gray-500 text-center py-8" x-text="t('no_appointments_range')"></p>
                        </div>
                    </div>
                </div>

                <!-- Modal crear/editar cita -->
                <div x-show="modalCita.show" x-cloak class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4" @keydown.escape.window="modalCita.show = false">
                    <div class="modal-mobile bg-white rounded-t-xl sm:rounded-lg shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-4 sm:p-6">
                        <h3 class="text-xl font-bold mb-4" x-text="modalCita.id ? t('edit_appointment') : t('new_appointment')"></h3>
                        <form @submit.prevent="saveModalCita()" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('patient_req')"></label>
                                <select x-model="modalCita.paciente_id" class="input-modern" required :disabled="!!modalCita.id">

                            <div><label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('password')"></label><input type="password" x-model="negocio.smtp_password" class="input-modern" placeholder="••••••••"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('from_email')"></label><input type="email" x-model="negocio.email_remitente" class="input-modern" :placeholder="t('ph_from_email')"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('from_name')"></label><input type="text" x-model="negocio.nombre_remitente" class="input-modern" :placeholder="t('ph_from_name')"></div>

                        <form @submit.prevent="savePlantillaRecordatorio()" class="space-y-4">

                            <div><label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('body')"></label><textarea x-model="plantillaRecordatorio.cuerpo" rows="5" class="input-modern" :placeholder="t('demo_email_body')"></textarea></div>

                            <div><label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('version')"></label><input type="text" x-model="textosLegales.version" class="input-modern w-24" placeholder="1"></div>
                            <button type="submit" :disabled="savingTextosLegales" class="btn-primary" x-text="t('save_legal')"></button>
                            <span x-show="textosLegalesMessage" class="ml-2 text-sm" :class="isOkMsg(textosLegalesMessage) ? 'text-green-600' : 'text-red-600'" x-text="textosLegalesMessage"></span>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tab: Hours -->
            <div x-show="activeTab === 'hours'">
                <div class="card bg-white p-6">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6" x-text="t('hours_title')"></h2>
                    
                    <div class="space-y-4">
                        <template x-for="(dayName, dayIndex) in dayNames()" :key="dayIndex">
                            <div class="card bg-white/80 border border-gray-100 p-4">
                                <div class="flex items-center justify-between mb-3">
                                    <h3 class="font-semibold text-gray-900" x-text="dayName"></h3>
                                    <button 
                                        @click="addTimeRange(dayIndex)"
                                        class="text-blue-600 hover:text-blue-700 text-sm"
                                    >
                                        <span x-text="t('add_hours')"></span>
                                    </button>
                                </div>
                                
                                <div class="space-y-2">
                                    <template x-for="(range, rangeIndex) in (openingHours[dayIndex] || [])" :key="rangeIndex">
                                        <div class="flex items-center gap-2">
                                            <input type="number" x-model="range[0]" min="0" max="23" class="input-modern w-20" :placeholder=\"t('start')\">
                                            <span>-</span>
                                            <input type="number" x-model="range[1]" min="0" max="23" class="input-modern w-20" :placeholder=\"t('end')\">
                                            <span class="text-sm text-gray-600">h</span>
                                            <button 
                                                @click="removeTimeRange(dayIndex, rangeIndex)"
                                                class="text-red-600 hover:text-red-700 text-sm"
                                            >
                                                Eliminar
                                            </button>
                                        </div>

                                    <p x-show="!openingHours[dayIndex] || openingHours[dayIndex].length === 0" class="text-sm text-gray-500">
                                        <span x-text="t('day_closed')"></span>
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>

                    <button @click="saveHours()" :disabled="savingHours" class="mt-6 btn-primary">
                        <span x-show="!savingHours" x-text="t('save_hours')"></span>
                        <span x-show="savingHours" x-text="t('saving')"></span>
                    </button>

                    <div x-show="hoursMessage" class="mt-4 p-4 rounded-lg" 
                         :class="isOkMsg(hoursMessage) ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'"
                         x-text="hoursMessage">
                    </div>
                </div>
            </div>

            <!-- Tab: Blocked -->
            <div x-show="activeTab === 'blocked'">
                <div class="card bg-white p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900" x-text="t('blocked_title_h')"></h2>
                        <button @click="showBlockForm = !showBlockForm" class="btn-primary" x-text="t('add_block')"></button>
                    </div>

                    <!-- Formulario para bloquear -->
                    <div x-show="showBlockForm" class="mb-6 card bg-gray-50/80 border border-gray-100 p-4">
                        <h3 class="font-semibold mb-4" x-text="t('new_block')"></h3>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    <span x-text="t('start_datetime')"></span>
                                </label>
                                <input type="datetime-local" x-model="blockForm.startTime" class="input-modern">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('end_datetime')"></label>
                                <input type="datetime-local" x-model="blockForm.endTime" class="input-modern">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('reason_optional')"></label>
                            <input type="text" x-model="blockForm.reason" class="input-modern" :placeholder=\"t('reason_ph')\">
                        </div>
                        <div class="flex gap-2">
                            <button @click="saveBlock()" class="btn-primary" x-text="t('save_block')"></button>
                            <button @click="showBlockForm = false; blockForm = { startTime: '', endTime: '', reason: '' }" class="btn-secondary" x-text="t('cancel')"></button>
                        </div>
                    </div>

                    <!-- Lista de bloqueos -->
                    <div class="space-y-4">
                        <template x-for="block in blockedSlots" :key="block.id">
                            <div class="card bg-white border border-gray-100 p-4">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="font-semibold text-gray-900">
                                            <span x-text="formatDate(block.start_time)"></span> 
                                            <span x-text="formatTime(block.start_time)"></span>
                                            - 
                                            <span x-text="formatTime(block.end_time)"></span>

                                        <p x-show="block.reason" class="text-sm text-gray-600 mt-1" x-text="block.reason"></p>
                                    </div>
                                    <button 
                                        @click="deleteBlock(block.id)"
                                        class="text-red-600 hover:text-red-700 text-sm font-medium"
                                    >
                                        Eliminar
                                    </button>
                                </div>
                            </div>
                        </template>
                        <p x-show="blockedSlots.length === 0" class="text-gray-500 text-center py-8">
                            <span x-text="t('no_blocks')"></span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Tab: Users -->
            <div x-show="activeTab === 'users'">
                <div class="card bg-white p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900" x-text="t('users_title')"></h2>
                        <button @click="showUserForm = !showUserForm" class="btn-primary" x-text="t('create_user')"></button>
                    </div>

                    <!-- Formulario para crear usuario -->
                    <div x-show="showUserForm" class="mb-6 card bg-gray-50/80 border border-gray-100 p-4">
                        <h3 class="font-semibold mb-4" x-text="t('new_user')"></h3>
                        <form @submit.prevent="createUser()" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('name')"></label>
                                <input type="text" x-model="userForm.name" class="input-modern" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('email')"></label>
                                <input type="email" x-model="userForm.email" class="input-modern" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('password_min')"></label>
                                <input type="password" x-model="userForm.password" class="input-modern" required minlength="6">
                            </div>
                            <div class="flex gap-2">
                                <button type="submit" :disabled="creatingUser" class="btn-primary">
                                    <span x-show="!creatingUser" x-text="t('create_user_btn')"></span>
                                    <span x-show="creatingUser" x-text="t('creating')"></span>
                                </button>
                                <button type="button" @click="showUserForm = false; userForm = { name: '', email: '', password: '' }" class="btn-secondary" x-text="t('cancel')"></button>
                            </div>
                            <div x-show="userMessage" class="p-4 rounded-lg" 
                                 :class="isOkMsg(userMessage) ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'"
                                 x-text="userMessage">
                            </div>
                        </form>
                    </div>

                    <!-- Lista de usuarios -->
                    <div class="space-y-4">
                        <template x-for="user in users" :key="user.id">
                            <div class="card bg-white border border-gray-100 p-4">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-semibold text-gray-900" x-text="user.name"></h3>
                                        <p class="text-sm text-gray-600" x-text="user.email"></p>
                                        <p class="text-xs text-gray-500 mt-1">
                                            <span x-text="t('created_at')"></span> <span x-text="formatDate(user.created_at)"></span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        function dashboard() {
            const i18n = window.I18n.alpineHelpers();
            return {
                ...i18n,
                isOkMsg(msg) {
                    if (!msg) return false;
                    return /correctamente|successfully|onnist|tallennet|luotu|cread|saved|conectad|connected|yhdistetty|desconect|disconnect|katkaistu|subida|uploaded|ladattu|creada|created|lähetetty|enviado|sent/i.test(String(msg));
                },
                labelEstado(estado) {
                    const map = {
                        confirmada: 'st_confirmed_cap',
                        completada: 'st_completed_cap',
                        pasada: 'st_past_cap',
                        cancelada: 'st_cancelled_cap',
                        pendiente: 'st_pending_cap',
                        no_asistio: 'st_no_show_cap',
                        activo: 'st_active',
                        en_proceso: 'st_in_progress',
                        alta_terapeutica: 'st_discharged',
                        inactivo: 'st_inactive'
                    };
                    const key = map[estado];
                    return key ? this.t(key) : (estado || '');
                },
                labelTipoSesion(tipo) {
                    if (!tipo) return '';
                    if (tipo === 'online') return this.t('online');
                    if (tipo === 'presencial') return this.t('in_person');
                    return tipo;
                },
                activeTab: 'inicio',
                stats: {},
                citas: [],
                pacientes: [],
                loadingPacientes: false,
                showPacienteForm: false,
                pacienteForm: { nombre: '', email: '', telefono: '', estado: 'activo', precio_sesion: '', notas_privadas: '' },
                pacienteBusqueda: '',
                pacienteEstadoFilter: '',
                creatingPaciente: false,
                pacienteMessage: '',
                fichaPaciente: { show: false, paciente: null, citas: [], totalSesiones: 0, facturacionEstimada: 0, proximaCita: null },
                editarPacienteId: null,
                editPacienteModal: { show: false },
                editPacienteForm: { nombre: '', email: '', telefono: '', estado: 'activo', precio_sesion: '', notas_privadas: '' },
                savingEditPaciente: false,
                editPacienteMessage: '',
                appointments: [],
                config: {},
                openingHours: {},
                blockedSlots: [],
                users: [],
                filters: {
                    startDate: '',
                    endDate: ''
                },
                appointmentViewMode: 'list',
                calendarWeekStart: '',
                modalCita: { show: false, id: null, paciente_id: '', fecha: '', hora_inicio: '', hora_fin: '', tipo_sesion: '', notas: '', estado: 'confirmada' },
                listaPacientesParaCita: [],
                reputacion: { googleReviewUrl: '' },
                reputacionStats: {},
                reputacionMessage: '',
                savingReputacion: false,
                googleCalendarConnected: false,
                googleCalendarSyncBusy: false,
                googleCalendarMessage: '',
                googleCalendarLoading: false,
                slotsCitaModal: [],
                savingModalCita: false,
                modalCitaMessage: '',
                deleteModal: {
                    show: false,
                    step2: false,
                    confirmText: '',
                    id: null
                },
                showBlockForm: false,
                showUserForm: false,
                blockForm: {
                    startTime: '',
                    endTime: '',
                    reason: ''
                },
                userForm: {
                    name: '',
                    email: '',
                    password: ''
                },
                savingConfig: false,
                savingDatosFiscales: false,
                datosFiscalesMessage: '',
                savingHours: false,
                creatingUser: false,
                configMessage: '',
                hoursMessage: '',
                userMessage: '',
                testEmailSending: false,
                testEmailMessage: '',
                negocio: {},
                brandColors: { primary: '#2563eb', secondary: '#0f172a' },
                brandPresets: (window.BrandTheme && window.BrandTheme.PRESETS) || [],
                savingBrandColors: false,
                brandColorsMessage: '',
                landingStats: { visits: 0, bookClicks: 0, bookings: 0, clickRate: 0, conversionRate: 0, last14Days: [] },
                plantillaRecordatorio: { asunto: '', cuerpo: '' },
                savingSmtp: false,
                smtpMessage: '',
                savingPlantilla: false,
                plantillaMessage: '',
                textosLegales: { politica_privacidad: '', consentimiento: '', version: '1' },
                savingTextosLegales: false,
                textosLegalesMessage: '',
                landing: { i18n_demo: false, hero_title: '', hero_subtitle: '', hero_image_url: '', about_title: '', about_text: '', about_image_url: '', cta_text: '', sections: [] },
                savingLanding: false,
                landingMessage: '',
                uploadingImageHero: false,
                uploadingImageAbout: false,
                facturaTab: 'nueva',
                facturas: [],
                facturaForm: {
                    cliente_nombre: '', cliente_nif: '', cliente_direccion: '', cliente_cp: '', cliente_ciudad: '', cliente_provincia: '',
                    concepto: '', descripcion: '', totalPagado: '', ivaPct: '25.5', forma_pago: ''
                },
                resumenFactura: { precioBase: '0,00 €', ivaPct: 25.5, ivaEur: '0,00 €', total: '0,00 €' },
                savingFactura: false,
                facturaMessage: '',

                async init() {
                    this.setCalendarWeekToNow();
                    await this.loadStats();
                    await Promise.all([
                        this.loadCitas(),
                        this.loadConfig(),
                        this.loadLanding(),
                        this.loadHours(),
                        this.loadBlockedSlots(),
                        this.loadUsers(),
                        this.loadGoogleCalendarStatus()
                    ]);
                    this.applyDemoLandingTexts();
                    this.applyDemoLegalTexts();
                    const params = new URLSearchParams(window.location.search);
                    if (params.get('google_calendar') === 'ok') {
                        this.googleCalendarMessage = this.t('msg_gc_connected');
                        this.activeTab = 'config';
                        await this.loadGoogleCalendarStatus();
                        window.history.replaceState({}, '', '/dashboard');
                    } else if (params.get('google_calendar') === 'error') {
                        this.googleCalendarMessage = decodeURIComponent(params.get('message') || this.t('msg_gc_connect_error'));
                        this.activeTab = 'config';
                        window.history.replaceState({}, '', '/dashboard');
                    }
                },

                async loadStats() {
                    try {
                        const res = await fetch('/dashboard/api/stats');
                        const data = await res.json();
                        this.stats = data;
                    } catch (e) {
                        this.stats = {};
                    }
                },

                async loadPacientes() {
                    this.loadingPacientes = true;
                    try {
                        let url = '/dashboard/api/pacientes?';
                        if (this.pacienteEstadoFilter) url += 'estado=' + encodeURIComponent(this.pacienteEstadoFilter) + '&';
                        if (this.pacienteBusqueda) url += 'busqueda=' + encodeURIComponent(this.pacienteBusqueda) + '&';
                        const res = await fetch(url);
                        const data = await res.json();
                        this.pacientes = data.pacientes || [];
                    } catch (e) {
                        this.pacientes = [];
                    } finally {
                        this.loadingPacientes = false;
                    }
                },

                openEditPaciente(p) {
                    this.fichaPaciente.show = false;
                    this.editPacienteModal = { show: true, pacienteId: p.id };
                    this.editPacienteForm = {
                        nombre: p.nombre || '',
                        email: p.email || '',
                        telefono: p.telefono || '',
                        estado: p.estado || 'activo',
                        precio_sesion: p.precio_sesion != null ? p.precio_sesion : '',
                        notas_privadas: p.notas_privadas || ''
                    };
                    this.editPacienteMessage = '';
                },

                async saveEditPaciente() {
                    const id = this.editPacienteModal.pacienteId;
                    if (!id) return;
                    this.savingEditPaciente = true;
                    this.editPacienteMessage = '';
                    try {
                        const res = await fetch('/dashboard/api/pacientes/' + id, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.editPacienteForm)
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.editPacienteModal.show = false;
                            this.editPacienteMessage = this.t('msg_patient_updated');
                            await this.loadPacientes();
                        } else {
                            this.editPacienteMessage = data.error || this.t('msg_save_error');
                        }
                    } catch (e) {
                        this.editPacienteMessage = this.t('msg_conn_error');
                    } finally {
                        this.savingEditPaciente = false;
                    }
                },

                async openFichaPaciente(id) {
                    try {
                        const res = await fetch('/dashboard/api/pacientes/' + id);
                        const data = await res.json();
                        this.fichaPaciente = {
                            show: true,
                            paciente: data.paciente,
                            citas: data.citas || [],
                            totalSesiones: data.totalSesiones || 0,
                            facturacionEstimada: data.facturacionEstimada ?? 0,
                            proximaCita: data.proximaCita || null
                        };
                    } catch (e) {
                        alert(this.t('msg_ficha_error'));
                    }
                },

                exportPacienteJson(ficha) {
                    if (!ficha || !ficha.paciente) return '{}';
                    return JSON.stringify({
                        paciente: ficha.paciente,
                        citas: ficha.citas,
                        totalSesiones: ficha.totalSesiones,
                        facturacionEstimada: ficha.facturacionEstimada,
                        proximaCita: ficha.proximaCita
                    }, null, 2);
                },

                downloadFichaJson() {
                    const json = this.exportPacienteJson(this.fichaPaciente);
                    const blob = new Blob([json], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'paciente-' + (this.fichaPaciente.paciente ? this.fichaPaciente.paciente.id : '') + '.json';
                    a.click();
                },

                async exportPaciente(id) {
                    try {
                        const res = await fetch('/dashboard/api/pacientes/' + id);
                        const data = await res.json();
                        const blob = new Blob([JSON.stringify({
                            paciente: data.paciente,
                            citas: data.citas,
                            totalSesiones: data.totalSesiones,
                            facturacionEstimada: data.facturacionEstimada,
                            proximaCita: data.proximaCita
                        }, null, 2)], { type: 'application/json' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = 'paciente-' + id + '.json';
                        a.click();
                    } catch (e) {
                        alert(this.t('msg_export_error'));
                    }
                },

                async confirmDeletePaciente(p) {
                    if (!confirm(this.tf('msg_delete_patient_confirm', { name: p.nombre }))) return;
                    try {
                        const res = await fetch('/dashboard/api/pacientes/' + p.id, { method: 'DELETE' });
                        const data = await res.json().catch(() => ({}));
                        if (data.success) {
                            await this.loadPacientes();
                        } else {
                            alert(data.error || this.t('msg_delete_patient_error'));
                        }
                    } catch (e) {
                        alert(this.t('msg_conn_error_delete'));
                    }
                },

                async createPaciente() {
                    this.creatingPaciente = true;
                    this.pacienteMessage = '';
                    try {
                        const res = await fetch('/dashboard/api/pacientes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.pacienteForm)
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.pacienteMessage = this.t('msg_patient_created');
                            this.pacienteForm = { nombre: '', email: '', telefono: '', estado: 'activo', precio_sesion: '', notas_privadas: '' };
                            this.showPacienteForm = false;
                            await this.loadPacientes();
                        } else {
                            this.pacienteMessage = data.error || this.t('msg_error');
                        }
                    } catch (e) {
                        this.pacienteMessage = this.t('msg_conn_error');
                    } finally {
                        this.creatingPaciente = false;
                    }
                },

                setCalendarWeekToNow() {
                    const today = new Date();
                    const day = today.getDay();
                    const diff = today.getDate() - (day === 0 ? 6 : day - 1);
                    const monday = new Date(today);
                    monday.setDate(diff);
                    this.calendarWeekStart = monday.toISOString().slice(0, 10);
                },

                getCalendarWeekDays() {
                    if (!this.calendarWeekStart) return [];
                    const m = new Date(this.calendarWeekStart + 'T12:00:00');
                    const days = [];
                    const dayNames = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
                    for (let i = 0; i < 7; i++) {
                        const d = new Date(m);
                        d.setDate(m.getDate() + i);
                        const dateStr = d.toISOString().slice(0, 10);
                        days.push({ date: dateStr, label: dayNames[i] + ' ' + d.getDate() });
                    }
                    return days;
                },

                getCalendarWeekLabel() {
                    if (!this.calendarWeekStart) return '';
                    const m = new Date(this.calendarWeekStart + 'T12:00:00');
                    const sun = new Date(m);
                    sun.setDate(m.getDate() + 6);
                    return m.getDate() + ' - ' + sun.getDate() + ' ' + sun.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
                },

                getCalendarHours() {
                    const h = [];
                    for (let i = 8; i <= 20; i++) h.push(i);
                    return h;
                },

                getCitasInCell(dayStr, hour) {
                    return this.citas.filter(c => {
                        const fechaStr = c.fecha ? String(c.fecha).slice(0, 10) : '';
                        if (fechaStr !== dayStr) return false;
                        const h = parseInt(String(c.hora_inicio).split(':')[0], 10);
                        return h === hour;
                    });
                },

                prevWeek() {
                    const m = new Date(this.calendarWeekStart + 'T12:00:00');
                    m.setDate(m.getDate() - 7);
                    this.calendarWeekStart = m.toISOString().slice(0, 10);
                    this.loadCitas();
                },

                nextWeek() {
                    const m = new Date(this.calendarWeekStart + 'T12:00:00');
                    m.setDate(m.getDate() + 7);
                    this.calendarWeekStart = m.toISOString().slice(0, 10);
                    this.loadCitas();
                },

                goToToday() {
                    this.setCalendarWeekToNow();
                    this.loadCitas();
                },

                async loadCitas() {
                    try {
                        if (this.appointmentViewMode === 'calendar' && this.calendarWeekStart) {
                            const mon = new Date(this.calendarWeekStart + 'T12:00:00');
                            const sun = new Date(mon);
                            sun.setDate(mon.getDate() + 6);
                            this.filters.startDate = this.calendarWeekStart;
                            this.filters.endDate = sun.getFullYear() + '-' + String(sun.getMonth() + 1).padStart(2, '0') + '-' + String(sun.getDate()).padStart(2, '0');
                        }
                        let url = '/dashboard/api/citas?';
                        if (this.filters.startDate) url += 'startDate=' + encodeURIComponent(this.filters.startDate) + '&';
                        if (this.filters.endDate) url += 'endDate=' + encodeURIComponent(this.filters.endDate) + '&';
                        const res = await fetch(url);
                        const data = await res.json();
                        this.citas = data.citas || [];
                    } catch (error) {
                        console.error('Error cargando citas:', error);
                        this.citas = [];
                    }
                },

                syncBrandColorsFromNegocio(n) {
                    const src = n || this.negocio || {};
                    const BT = window.BrandTheme;
                    const primary = (BT && BT.normalizeHex(src.color_primary)) || (BT && BT.DEFAULT_PRIMARY) || '#2563eb';
                    const secondary = (BT && BT.normalizeHex(src.color_secondary)) || (BT && BT.DEFAULT_SECONDARY) || '#0f172a';
                    this.brandColors = { primary: primary, secondary: secondary };
                },

                previewBrandColors() {
                    if (window.BrandTheme) {
                        window.BrandTheme.apply(this.brandColors.primary, this.brandColors.secondary);
                    }
                },

                normalizeBrandColor(which) {
                    const BT = window.BrandTheme;
                    if (!BT) return;
                    const key = which === 'secondary' ? 'secondary' : 'primary';
                    const norm = BT.normalizeHex(this.brandColors[key]);
                    if (norm) this.brandColors[key] = norm;
                    else this.brandColors[key] = key === 'secondary' ? BT.DEFAULT_SECONDARY : BT.DEFAULT_PRIMARY;
                    this.previewBrandColors();
                },

                applyPreset(p) {
                    if (!p) return;
                    this.brandColors = { primary: p.primary, secondary: p.secondary };
                    this.previewBrandColors();
                },

                async saveBrandColors() {
                    this.normalizeBrandColor('primary');
                    this.normalizeBrandColor('secondary');
                    this.savingBrandColors = true;
                    this.brandColorsMessage = '';
                    try {
                        const res = await fetch('/dashboard/api/negocio', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                color_primary: this.brandColors.primary,
                                color_secondary: this.brandColors.secondary
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.negocio.color_primary = this.brandColors.primary;
                            this.negocio.color_secondary = this.brandColors.secondary;
                            this.brandColorsMessage = this.t('msg_colors_saved');
                            this.previewBrandColors();
                        } else {
                            this.brandColorsMessage = data.error || this.t('msg_error');
                        }
                    } catch (e) {
                        this.brandColorsMessage = this.t('msg_conn_error');
                    } finally {
                        this.savingBrandColors = false;
                    }
                },

                actualizarResumenFactura() {
                    const total = parseFloat(this.facturaForm.totalPagado) || 0;
                    const ivaPct = parseFloat(this.facturaForm.ivaPct) || 25.5;
                    const precioBase = total / (1 + ivaPct / 100);
                    const ivaEur = total - precioBase;
                    this.resumenFactura = {
                        precioBase: precioBase.toFixed(2).replace('.', ',') + ' €',
                        ivaPct: ivaPct,
                        ivaEur: ivaEur.toFixed(2).replace('.', ',') + ' €',
                        total: total.toFixed(2).replace('.', ',') + ' €'
                    };
                },
                formatEuroFactura(n) {
                    if (n == null) return '0,00 €';
                    const x = typeof n === 'number' ? n : parseFloat(n);
                    return isNaN(x) ? '0,00 €' : x.toFixed(2).replace('.', ',') + ' €';
                },
                async loadFacturas() {
                    try {
                        const res = await fetch('/dashboard/api/facturas');
                        const data = await res.json();
                        this.facturas = data.facturas || [];
                    } catch (e) {
                        this.facturas = [];
                    }
                },
                async eliminarFactura(f) {
                    if (!f || !confirm(this.tf('msg_invoice_delete_confirm', { n: f.numero_factura || '' }))) return;
                    try {
                        const res = await fetch('/dashboard/api/facturas/' + f.id, { method: 'DELETE' });
                        const data = await res.json().catch(() => ({}));
                        if (data.success) {
                            await this.loadFacturas();
                        } else {
                            alert(data.error || this.t('msg_delete_error'));
                        }
                    } catch (e) {
                        alert(this.t('msg_conn_error'));
                    }
                },
                async crearFactura() {
                    this.savingFactura = true;
                    this.facturaMessage = '';
                    try {
                        const res = await fetch('/dashboard/api/facturas', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                ...this.facturaForm,
                                idioma: this.lang || (window.I18n && window.I18n.getLang && window.I18n.getLang()) || 'fi'
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.facturaMessage = this.tf('msg_invoice_created', { n: data.numero_factura });
                            this.facturaForm = { cliente_nombre: '', cliente_nif: '', cliente_direccion: '', cliente_cp: '', cliente_ciudad: '', cliente_provincia: '', concepto: '', descripcion: '', totalPagado: '', ivaPct: '25.5', forma_pago: '' };
                            this.actualizarResumenFactura();
                            await this.loadFacturas();
                        } else {
                            this.facturaMessage = data.error || this.t('msg_invoice_error');
                        }
                    } catch (e) {
                        this.facturaMessage = this.t('msg_conn_error');
                    } finally {
                        this.savingFactura = false;
                    }
                },

                async loadReputacion() {
                    try {
                        const [configRes, statsRes] = await Promise.all([
                            fetch('/dashboard/api/reputacion-pro'),
                            fetch('/dashboard/api/reputacion-pro/stats')
                        ]);
                        const configData = await configRes.json();
                        const statsData = await statsRes.json();
                        this.reputacion = { googleReviewUrl: configData.googleReviewUrl || '' };
                        this.reputacionStats = statsData;
                    } catch (e) {
                        this.reputacionStats = {};
                    }
                },
                async saveReputacion() {
                    this.savingReputacion = true;
                    this.reputacionMessage = '';
                    try {
                        const res = await fetch('/dashboard/api/reputacion-pro', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ googleReviewUrl: this.reputacion.googleReviewUrl || '' })
                        });
                        const data = await res.json();
                        this.reputacionMessage = data.success ? this.t('msg_rep_saved') : (data.error || this.t('msg_error'));
                        if (data.success) await this.loadReputacion();
                    } catch (e) {
                        this.reputacionMessage = this.t('msg_conn_error');
                    } finally {
                        this.savingReputacion = false;
                    }
                },

                async sendTestEmail() {
                    this.testEmailMessage = '';
                    this.testEmailSending = true;
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 15000);
                    try {
                        const response = await fetch('/dashboard/api/test-email', {
                            method: 'POST',
                            credentials: 'same-origin',
                            signal: controller.signal
                        });
                        clearTimeout(timeout);
                        const data = await response.json().catch(() => ({}));
                        const serverError = data.error || (response.ok ? '' : 'Error del servidor.');
                        this.testEmailMessage = data.message || serverError || (response.ok ? this.t('msg_test_email_sent') : (this.t('msg_error') + ' ' + response.status));
                        if (!response.ok && serverError) {
                            console.error('[Test email] Respuesta del servidor:', response.status, data);
                        }
                    } catch (e) {
                        clearTimeout(timeout);
                        this.testEmailMessage = e.name === 'AbortError' ? 'Tiempo de espera agotado. Revisa SMTP en Railway.' : 'Error de conexión.';
                        console.error('[Test email] Error:', e);
                    } finally {
                        this.testEmailSending = false;
                    }
                },

                addTimeRange(dayIndex) {
                    if (!this.openingHours[dayIndex]) {
                        this.openingHours[dayIndex] = [];
                    }
                    this.openingHours[dayIndex].push([9, 18]);
                },

                removeTimeRange(dayIndex, rangeIndex) {
                    this.openingHours[dayIndex].splice(rangeIndex, 1);
                    if (this.openingHours[dayIndex].length === 0) {
                        delete this.openingHours[dayIndex];
                    }
                },

                async saveHours() {
                    this.savingHours = true;
                    this.hoursMessage = '';

                    try {
                        const response = await fetch('/dashboard/api/opening-hours', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ openingHours: this.openingHours })
                        });
                        const data = await response.json();
                        this.hoursMessage = data.success ? this.t('msg_hours_saved') : data.error;
                    } catch (error) {
                        this.hoursMessage = this.t('msg_hours_error');
                    } finally {
                        this.savingHours = false;
                    }
                },

                async saveBlock() {
                    if (!this.blockForm.startTime || !this.blockForm.endTime) {
                        alert(this.t('msg_block_dates_required'));
                        return;
                    }

                    try {
                        // Convertir datetime-local a ISO
                        const startISO = new Date(this.blockForm.startTime).toISOString();
                        const endISO = new Date(this.blockForm.endTime).toISOString();

                        const response = await fetch('/dashboard/api/blocked-slots', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                startTime: startISO,
                                endTime: endISO,
                                reason: this.blockForm.reason
                            })
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.blockForm = { startTime: '', endTime: '', reason: '' };
                            this.showBlockForm = false;
                            await this.loadBlockedSlots();
                        } else {
                            alert(data.error || this.t('msg_block_save_error'));
                        }
                    } catch (error) {
                        console.error('Error guardando bloqueo:', error);
                        alert(this.t('msg_block_save_fail'));
                    }
                },

                async deleteBlock(id) {
                    if (!confirm(this.t('msg_block_delete_confirm'))) return;

                    try {
                        const response = await fetch(`/dashboard/api/blocked-slots/${id}`, {
                            method: 'DELETE'
                        });
                        const data = await response.json();
                        if (data.success) {
                            await this.loadBlockedSlots();
                        }
                    } catch (error) {
                        console.error('Error eliminando bloqueo:', error);
                        alert(this.t('msg_block_delete_error'));
                    }
                },

                async createUser() {
                    this.creatingUser = true;
                    this.userMessage = '';

                    try {
                        const response = await fetch('/dashboard/api/users', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.userForm)
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.userMessage = this.t('msg_user_created');
                            this.userForm = { name: '', email: '', password: '' };
                            this.showUserForm = false;
                            await this.loadUsers();
                        } else {
                            this.userMessage = data.error || this.t('msg_user_error');
                        }
                    } catch (error) {
                        this.userMessage = this.t('msg_user_error');
                    } finally {
                        this.creatingUser = false;
                    }
                },

                async logout() {
                    try {
                        await fetch('/dashboard/logout', { method: 'POST' });
                        window.location.href = '/login';
                    } catch (error) {
                        window.location.href = '/login';
                    }
                },

                formatDate(dateString) {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('es-ES', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                },

                formatTime(dateString) {
                    const date = new Date(dateString);
                    return date.toLocaleTimeString('es-ES', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            }
        }
    </script>
</body>
</html>
