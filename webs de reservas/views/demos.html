<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Demos · llamadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/i18n.js"></script>
  <style>
    :root {
      --ink: #0c1f1c;
      --teal: #0f766e;
      --teal-dark: #0d5c56;
      --sand: #f3efe6;
      --card: #fffdf8;
    }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(15,118,110,.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(180,83,9,.12), transparent 50%),
        var(--sand);
      color: var(--ink);
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    h1, h2 { font-family: 'Fraunces', Georgia, serif; }
    [x-cloak] { display: none !important; }
    .input {
      width: 100%; min-height: 48px; font-size: 16px;
      border: 1px solid #d6d0c4; border-radius: 12px;
      padding: .75rem 1rem; background: #fff;
    }
    .input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,118,110,.15); }
    .btn {
      min-height: 44px; border-radius: 12px; font-weight: 600;
      padding: .65rem 1rem; border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-size: .875rem;
    }
    .btn-primary { background: var(--teal); color: #fff; }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-ghost { background: transparent; border: 1px solid #cfc7b8; color: var(--ink); }
    .btn-danger { background: #b91c1c; color: #fff; }
    .btn-danger:hover { background: #991b1b; }
    .card {
      background: var(--card);
      border: 1px solid rgba(12,31,28,.08);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(12,31,28,.05);
    }
    .link-row {
      display: flex; flex-direction: column; gap: .35rem;
      padding: .65rem .75rem; border-radius: 10px;
      background: rgba(15,118,110,.06); margin-top: .5rem;
    }
    .link-row a { word-break: break-all; color: #0f766e; text-decoration: underline; font-size: .8rem; }
    .label-mini { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; opacity: .55; font-weight: 600; }
  </style>
</head>
<body>
  <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12" x-data="demosApp()" x-cloak x-init="init()" @app-lang-changed.window="onLangChanged($event)">
    <header class="mb-8">
      <div class="flex flex-wrap items-start justify-between gap-3 mb-2">
        <p class="text-sm font-medium tracking-wide uppercase text-teal-800/70" x-text="t('demos_eyebrow')"></p>
        <div x-html="langHtml"></div>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-[var(--ink)]" x-text="t('demos_title')"></h1>
      <p class="mt-2 text-[var(--ink)]/70 max-w-xl" x-text="t('demos_intro')"></p>
    </header>

    <section class="card p-5 sm:p-6 mb-6" x-show="!authed">
      <h2 class="text-xl font-semibold mb-3" x-text="t('demos_access')"></h2>
      <p class="text-sm text-[var(--ink)]/60 mb-4" x-text="t('demos_access_hint')"></p>
      <form @submit.prevent="login" class="space-y-3">
        <input class="input" type="password" x-model="secret" :placeholder="t('demos_key_ph')" autocomplete="current-password" required>
        <p class="text-red-600 text-sm" x-show="error" x-text="error"></p>
        <button class="btn btn-primary w-full sm:w-auto" type="submit" :disabled="busy" x-text="t('demos_enter')"></button>
      </form>
    </section>

    <template x-if="authed">
      <div>
        <section class="card p-5 sm:p-6 mb-6">
          <h2 class="text-xl font-semibold mb-1" x-text="t('demos_new')"></h2>
          <p class="text-sm text-[var(--ink)]/60 mb-4" x-text="t('demos_new_hint')"></p>
          <form @submit.prevent="createDemo" class="grid gap-3 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="block text-sm mb-1" x-text="t('demos_biz_name')"></label>
              <input class="input" x-model="form.nombre" placeholder="María López Psicología" required>
            </div>
            <div>
              <label class="block text-sm mb-1" x-text="t('email')"></label>
              <input class="input" type="email" x-model="form.email" placeholder="maria@email.com">
            </div>
            <div>
              <label class="block text-sm mb-1"><span x-text="t('phone')"></span> (<span x-text="t('optional')"></span>)</label>
              <input class="input" type="tel" x-model="form.telefono" placeholder="+34 600 000 000">
            </div>
            <div class="sm:col-span-2 flex flex-wrap gap-3 items-center">
              <button class="btn btn-primary" type="submit" :disabled="busy" x-text="t('demos_create')"></button>
              <button class="btn btn-ghost" type="button" @click="logout" x-text="t('demos_exit')"></button>
            </div>
          </form>
          <p class="text-red-600 text-sm mt-3" x-show="error" x-text="error"></p>
          <div class="mt-4 p-4 rounded-xl bg-teal-50 border border-teal-100" x-show="lastUrl">
            <p class="text-sm font-medium text-teal-900 mb-1" x-text="t('demos_landing_ready')"></p>
            <a class="break-all text-teal-800 underline text-sm" :href="lastUrl" x-text="lastUrl" target="_blank" rel="noopener"></a>
            <div class="mt-3 flex flex-wrap gap-2">
              <button class="btn btn-primary" type="button" @click="copy(lastUrl)" x-text="t('copy')"></button>
              <a class="btn btn-ghost inline-flex items-center" :href="'https://wa.me/?text=' + encodeURIComponent('Hola, aquí tienes tu demo: ' + lastUrl)" target="_blank" rel="noopener" x-text="t('demos_whatsapp')"></a>
            </div>
          </div>
        </section>

        <section class="card p-5 sm:p-6">
          <div class="flex items-center justify-between gap-3 mb-4">
            <h2 class="text-xl font-semibold" x-text="t('demos_list')"></h2>
            <button class="btn btn-ghost" type="button" @click="loadDemos" :disabled="busy" x-text="t('demos_refresh')"></button>
          </div>
          <p class="text-sm text-[var(--ink)]/50 mb-4" x-show="!demos.length" x-text="t('demos_empty')"></p>
          <ul class="space-y-5">
            <template x-for="d in demos" :key="d.id">
              <li class="border border-black/5 rounded-xl p-4 bg-white/70">
                <div class="flex flex-col gap-3">
                  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2">
                    <div>
                      <p class="font-semibold text-lg" x-text="d.nombre"></p>
                      <p class="text-sm text-[var(--ink)]/60" x-text="(d.email || '—') + (d.telefono ? ' · ' + d.telefono : '')"></p>
                      <p class="text-xs mt-1 text-[var(--ink)]/45">
                        <span x-text="d.citas_count + ' ' + t('demos_appointments')"></span> ·
                        <span x-text="(d.users_count || (d.users && d.users.length) || 0) + ' ' + t('demos_users')"></span> ·
                        <span x-text="d.slug"></span>
                        <span x-show="d.slug === 'principal' || d.id === 1" x-text="' · ' + t('demos_principal')"></span>
                      </p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                      <button class="btn btn-primary" type="button" @click="openActivate(d)" x-text="t('demos_activate')"></button>
                      <button
                        class="btn btn-danger"
                        type="button"
                        x-show="d.id !== 1 && d.slug !== 'principal'"
                        @click="confirmDelete(d)"
                        :disabled="busy"
                       x-text="t('demos_delete')"></button>
                    </div>
                  </div>

                  <!-- Links del tenant -->
                  <div class="link-row">
                    <span class="label-mini" x-text="t('demos_landing_label')"></span>
                    <div class="flex flex-wrap items-center gap-2">
                      <a :href="d.landingUrl || d.url" x-text="d.landingUrl || d.url" target="_blank" rel="noopener"></a>
                      <button class="btn btn-ghost" type="button" @click="copy(d.landingUrl || d.url)" x-text="t('copy')"></button>
                    </div>
                  </div>
                  <div class="link-row">
                    <span class="label-mini" x-text="t('demos_login_label')"></span>
                    <div class="flex flex-wrap items-center gap-2">
                      <a :href="d.loginUrl" x-text="d.loginUrl" target="_blank" rel="noopener"></a>
                      <button class="btn btn-ghost" type="button" @click="copy(d.loginUrl)" x-text="t('copy')"></button>
                    </div>
                  </div>
                  <div class="link-row">
                    <span class="label-mini" x-text="t('demos_dash_label')"></span>
                    <div class="flex flex-wrap items-center gap-2">
                      <a :href="d.dashboardUrl" x-text="d.dashboardUrl" target="_blank" rel="noopener"></a>
                      <button class="btn btn-ghost" type="button" @click="copy(d.dashboardUrl)" x-text="t('copy')"></button>
                    </div>
                  </div>

                  <!-- Usuarios de este tenant -->
                  <div class="mt-1">
                    <p class="label-mini mb-2" x-text="t('demos_users_title')"></p>
                    <p class="text-sm text-[var(--ink)]/50" x-show="!d.users || !d.users.length" x-text="t('demos_no_users')"></p>
                    <ul class="space-y-2" x-show="d.users && d.users.length">
                      <template x-for="u in (d.users || [])" :key="u.id">
                        <li class="rounded-lg border border-black/5 bg-white p-3">
                          <p class="font-medium text-sm" x-text="u.name || 'Usuario'"></p>
                          <p class="text-sm text-[var(--ink)]/70"><span x-text="t('demos_email_login')"></span>: <strong x-text="u.email"></strong></p>
                          <div class="mt-2 space-y-1">
                            <div class="flex flex-wrap items-center gap-2 text-xs">
                              <span class="label-mini" x-text="t('demos_login_label')"></span>
                              <a :href="u.loginUrl || d.loginUrl" x-text="u.loginUrl || d.loginUrl" target="_blank" rel="noopener"></a>
                              <button class="btn btn-ghost" type="button" @click="copy(u.loginUrl || d.loginUrl)" x-text="t('copy')"></button>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 text-xs">
                              <span class="label-mini" x-text="t('demos_dash_label')"></span>
                              <a :href="u.dashboardUrl || d.dashboardUrl" x-text="u.dashboardUrl || d.dashboardUrl" target="_blank" rel="noopener"></a>
                              <button class="btn btn-ghost" type="button" @click="copy(u.dashboardUrl || d.dashboardUrl)" x-text="t('copy')"></button>
                            </div>
                            <button class="btn btn-ghost mt-1" type="button" @click="copyAccessPack(d, u)" x-text="t('demos_copy_pack')"></button>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              </li>
            </template>
          </ul>
        </section>

        <!-- Modal activar -->
        <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-black/40" x-show="activateDemo" @keydown.escape.window="activateDemo=null">
          <div class="card w-full max-w-md p-5 sm:p-6" @click.outside="activateDemo=null">
            <h3 class="text-lg font-semibold mb-1" x-text="t('demos_modal_title')"></h3>
<p class="text-sm text-[var(--ink)]/60 mb-4" x-text="t('demos_modal_hint')"></p>
            <form class="space-y-3" @submit.prevent="activate">
              <div>
                <label class="block text-sm mb-1" x-text="t('name')"></label>
                <input class="input" x-model="activateForm.name" required>
              </div>
              <div>
                <label class="block text-sm mb-1" x-text="t('demos_email_login')"></label>
                <input class="input" type="email" x-model="activateForm.email" required>
              </div>
              <div>
                <label class="block text-sm mb-1" x-text="t('demos_pass_label')"></label>
                <input class="input" type="text" x-model="activateForm.password" required minlength="6">
              </div>
              <p class="text-red-600 text-sm" x-show="activateError" x-text="activateError"></p>
              <div class="rounded-lg bg-teal-50 p-3 text-sm text-teal-900 space-y-1" x-show="activateOk">
                <p x-text="activateOk"></p>
                <template x-if="lastActivated">
                  <div class="space-y-1 pt-1">
                    <p><span class="label-mini" x-text="t('demos_landing_label')"></span> <a class="underline break-all" :href="lastActivated.landingUrl" x-text="lastActivated.landingUrl" target="_blank"></a></p>
                    <p><span class="label-mini" x-text="t('demos_login_label')"></span> <a class="underline break-all" :href="lastActivated.loginUrl" x-text="lastActivated.loginUrl" target="_blank"></a></p>
                    <p><span class="label-mini" x-text="t('demos_dash_label')"></span> <a class="underline break-all" :href="lastActivated.dashboardUrl" x-text="lastActivated.dashboardUrl" target="_blank"></a></p>
                    <p><span x-text="t('email')"></span>: <strong x-text="lastActivated.email"></strong> · <span x-text="t('password')"></span>: <strong x-text="lastActivated.password"></strong></p>
                    <button class="btn btn-primary w-full mt-2" type="button" @click="copyActivatedPack()" x-text="t('demos_copy_all')"></button>
                  </div>
                </template>
              </div>
              <div class="flex gap-2 pt-1">
                <button class="btn btn-primary flex-1" type="submit" :disabled="busy" x-text="t('demos_create_user')"></button>
                <button class="btn btn-ghost" type="button" @click="activateDemo=null" x-text="t('close')"></button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </template>
  </div>

  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    function demosApp() {
      const i = window.I18n.alpineHelpers();
      return {
        ...i,
        authed: false,
        secret: '',
        busy: false,
        error: '',
        form: { nombre: '', email: '', telefono: '' },
        demos: [],
        lastUrl: '',
        activateDemo: null,
        activateForm: { name: '', email: '', password: '' },
        activateError: '',
        activateOk: '',
        lastActivated: null,

        async init() {
          try {
            const r = await fetch('/api/demos');
            if (r.ok) {
              this.authed = true;
              const data = await r.json();
              this.demos = data.demos || [];
            }
          } catch (e) {}
        },

        async login() {
          this.busy = true; this.error = '';
          try {
            const r = await fetch('/api/demos/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ secret: this.secret })
            });
            const data = await r.json();
            if (!r.ok) { this.error = data.error || 'Clave incorrecta'; return; }
            this.authed = true;
            this.secret = '';
            await this.loadDemos();
          } catch (e) {
            this.error = 'Error de red';
          } finally { this.busy = false; }
        },

        async logout() {
          await fetch('/api/demos/logout', { method: 'POST' });
          this.authed = false;
          this.demos = [];
          this.lastUrl = '';
        },

        async loadDemos() {
          this.busy = true; this.error = '';
          try {
            const r = await fetch('/api/demos');
            if (r.status === 401) { this.authed = false; return; }
            const data = await r.json();
            this.demos = data.demos || [];
          } catch (e) {
            this.error = 'No se pudieron cargar demos';
          } finally { this.busy = false; }
        },

        async createDemo() {
          this.busy = true; this.error = ''; this.lastUrl = '';
          try {
            const r = await fetch('/api/demos', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form)
            });
            const data = await r.json();
            if (!r.ok) { this.error = data.error || 'Error'; return; }
            this.lastUrl = data.landingUrl || data.url;
            this.form = { nombre: '', email: '', telefono: '' };
            await this.copy(this.lastUrl);
            await this.loadDemos();
          } catch (e) {
            this.error = 'Error creando demo';
          } finally { this.busy = false; }
        },

        openActivate(d) {
          this.activateDemo = d;
          this.activateError = '';
          this.activateOk = '';
          this.lastActivated = null;
          this.activateForm = {
            name: d.nombre || '',
            email: d.email || '',
            password: 'Cambio' + Math.floor(1000 + Math.random() * 9000)
          };
        },

        async activate() {
          if (!this.activateDemo) return;
          this.busy = true; this.activateError = ''; this.activateOk = ''; this.lastActivated = null;
          try {
            const r = await fetch('/api/demos/' + this.activateDemo.id + '/activate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.activateForm)
            });
            const data = await r.json();
            if (!r.ok) { this.activateError = data.error || 'Error'; return; }
            this.activateOk = this.t('demos_user_ready');
            this.lastActivated = {
              email: this.activateForm.email,
              password: this.activateForm.password,
              landingUrl: data.landingUrl,
              loginUrl: data.loginUrl,
              dashboardUrl: data.dashboardUrl
            };
            await this.loadDemos();
          } catch (e) {
            this.activateError = 'Error de red';
          } finally { this.busy = false; }
        },

        async confirmDelete(d) {
          const ok = window.confirm(
            '¿Eliminar «' + d.nombre + '»?\n\nSe borran usuarios, citas, pacientes y landing de este tenant.\nEsta acción no se puede deshacer.'
          );
          if (!ok) return;
          this.busy = true; this.error = '';
          try {
            const r = await fetch('/api/demos/' + d.id, { method: 'DELETE' });
            const data = await r.json();
            if (!r.ok) { this.error = data.error || 'No se pudo eliminar'; return; }
            await this.loadDemos();
          } catch (e) {
            this.error = 'Error eliminando';
          } finally { this.busy = false; }
        },

        copyAccessPack(d, u) {
          const text = [
            'Acceso a tu sistema de reservas',
            '',
            'Landing (reservas): ' + (d.landingUrl || d.url),
            'Login: ' + (u.loginUrl || d.loginUrl),
            'Dashboard: ' + (u.dashboardUrl || d.dashboardUrl),
            'Usuario (email): ' + u.email,
            '',
            'Entra en Login con tu email. Si no tienes contraseña, pídesela a tu comercial.'
          ].join('\n');
          this.copy(text);
        },

        copyActivatedPack() {
          if (!this.lastActivated) return;
          const a = this.lastActivated;
          const text = [
            'Acceso a tu sistema de reservas',
            '',
            'Landing: ' + a.landingUrl,
            'Login: ' + a.loginUrl,
            'Dashboard: ' + a.dashboardUrl,
            'Email: ' + a.email,
            'Contraseña: ' + a.password,
            '',
            'Entra en Login, cambia la contraseña cuando puedas.'
          ].join('\n');
          this.copy(text);
        },

        async copy(text) {
          try {
            await navigator.clipboard.writeText(text);
          } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta);
          }
        }
      };
    }
  </script>
</body>
</html>
